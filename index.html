<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bethany Does Things</title>
</head>
<body>

  <!-- Existing site content remains unchanged above this point. -->

  <!-- Support is intentionally parked for later Zeffy integration. -->

  <section id="contact" class="section contact-section">
    <div class="contact-card">
      <div class="section-heading">
        <h2>Want to Say Hello?</h2>
        <p class="section-intro">Have a puzzle suggestion?<br>Want to challenge Bethany?<br>Just want to leave a little encouragement?</p>
      </div>

      <form
        id="contact-form"
        class="contact-form"
        action="https://formsubmit.co/beth@bethanydoesthings.com"
        method="POST"
      >
        <input type="hidden" name="_subject" value="New Message from Bethany Does Things">
        <input type="hidden" name="_captcha" value="true">
        <input type="hidden" name="_template" value="table">

        <label>
          Name <span>(optional)</span>
          <input type="text" name="name" autocomplete="name">
        </label>

        <label>
          Email <span>*</span>
          <input type="email" name="email" autocomplete="email" required>
        </label>

        <label>
          Message <span>*</span>
          <textarea name="message" rows="6" required></textarea>
        </label>

        <button class="button button-primary" type="submit">Send Message <span>✦</span></button>
        <p id="form-status" class="form-status" aria-live="polite"></p>
      </form>
    </div>
  </section>

  <div class="puzzle-modal" id="puzzle-modal" aria-hidden="true">
    <div class="puzzle-modal-card" role="dialog" aria-modal="true" aria-labelledby="puzzle-modal-title">
      <button class="puzzle-modal-close" type="button" aria-label="Close puzzle details">×</button>
      <h3 id="puzzle-modal-title"></h3>
      <p id="puzzle-modal-description"></p>
    </div>
  </div>

  <footer class="site-footer">
    <img src="images/logo.png" alt="Bethany Does Things" class="footer-logo">
    <p>Made with puzzles, curiosity, and a little bit of fun.</p>
    <p class="footer-small">© <span id="year"></span> Bethany Does Things</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
